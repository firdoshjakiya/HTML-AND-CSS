<!DOCTYPE html>
<html>
<head>
<title>Periodic Table</title>
<style>
    body {
        background-color: rgb(255, 255, 255); /* white background */
        font-family: Arial, sans-serif;
        text-align: center;
    }
    h1 {
        color: rgb(51, 51, 51);
    }
    table {
        border-collapse: collapse;
        margin: 20px auto;
    }
    td {
        width: 60px;
        height: 60px;
        text-align: center;
        vertical-align: middle;
        border: 1px solid rgb(153, 153, 153);
        color: rgb(0, 0, 0);
        font-weight: bold;
    }
     .alkali { background-color: rgb(253, 37, 37); }          /* red shade */
    .alkaline { background-color: rgb(251, 167, 40); }        /* orange shade */
    .transition { background-color: rgb(244, 244, 16); }      /* yellow */
    .post-transition { background-color: rgb(88, 245, 88); } /* light green */
    .metalloid { background-color: rgb(153, 255, 204); }       /* aqua */
    .nonmetal { background-color: rgb(89, 141, 193); }        /* light blue */
    .halogen { background-color: rgb(112, 60, 164); }         /* violet */
    .noble { background-color: rgb(194, 57, 148); }           /* pink */
    .lanthanoid { background-color: rgb(119, 119, 233); }      /* lavender */
    .actinoid { background-color: rgb(229, 118, 229); }        /* light pink */
</style>
</head>
<body>

<h1>PERIODIC TABLE</h1>

<div>
<table>
    <tr>
        <td class="nonmetal">H</td>
        <td colspan="16"></td>
        <td class="noble">He</td>
    </tr>
    <tr>
        <td class="alkali">Li</td>
        <td class="alkaline">Be</td>
        <td colspan="10"></td>
        <td class="metalloid">B</td>
        <td class="nonmetal">C</td>
        <td class="nonmetal">N</td>
        <td class="nonmetal">O</td>
        <td class="halogen">F</td>
        <td class="noble">Ne</td>
    </tr>
    <tr>
        <td class="alkali">Na</td>
        <td class="alkaline">Mg</td>
        <td colspan="10"></td>
        <td class="post-transition">Al</td>
        <td class="metalloid">Si</td>
        <td class="nonmetal">P</td>
        <td class="nonmetal">S</td>
        <td class="halogen">Cl</td>
        <td class="noble">Ar</td>
    </tr>
    <tr>
        <td class="alkali">K</td>
        <td class="alkaline">Ca</td>
        <td class="transition">Sc</td>
        <td class="transition">Ti</td>
        <td class="transition">V</td>
        <td class="transition">Cr</td>
        <td class="transition">Mn</td>
        <td class="transition">Fe</td>
        <td class="transition">Co</td>
        <td class="transition">Ni</td>
        <td class="transition">Cu</td>
        <td class="transition">Zn</td>
        <td class="post-transition">Ga</td>
        <td class="metalloid">Ge</td>
        <td class="metalloid">As</td>
        <td class="nonmetal">Se</td>
        <td class="halogen">Br</td>
        <td class="noble">Kr</td>
    </tr>
    <tr>
        <td class="alkali">Rb</td>
        <td class="alkaline">Sr</td>
        <td class="transition">Y</td>
        <td class="transition">Zr</td>
        <td class="transition">Nb</td>
        <td class="transition">Mo</td>
        <td class="transition">Tc</td>
        <td class="transition">Ru</td>
        <td class="transition">Rh</td>
        <td class="transition">Pd</td>
        <td class="transition">Ag</td>
        <td class="transition">Cd</td>
        <td class="post-transition">In</td>
        <td class="post-transition">Sn</td>
        <td class="metalloid">Sb</td>
        <td class="metalloid">Te</td>
        <td class="halogen">I</td>
        <td class="noble">Xe</td>
    </tr>
    <tr>
        <td class="alkali">Cs</td>
        <td class="alkaline">Ba</td>
        <td class="lanthanoid">La</td>
        <td class="transition">Hf</td>
        <td class="transition">Ta</td>
        <td class="transition">W</td>
        <td class="transition">Re</td>
        <td class="transition">Os</td>
        <td class="transition">Ir</td>
        <td class="transition">Pt</td>
        <td class="transition">Au</td>
        <td class="transition">Hg</td>
        <td class="post-transition">Tl</td>
        <td class="post-transition">Pb</td>
        <td class="post-transition">Bi</td>
        <td class="metalloid">Po</td>
        <td class="halogen">At</td>
        <td class="noble">Rn</td>
    </tr>
    <tr>
        <td class="alkali">Fr</td>
        <td class="alkaline">Ra</td>
        <td class="actinoid">Ac</td>
        <td class="transition">Rf</td>
        <td class="transition">Db</td>
        <td class="transition">Sg</td>
        <td class="transition">Bh</td>
        <td class="transition">Hs</td>
        <td class="transition">Mt</td>
        <td class="transition">Ds</td>
        <td class="transition">Rg</td>
        <td class="transition">Cn</td>
        <td class="post-transition">Nh</td>
        <td class="post-transition">Fl</td>
        <td class="post-transition">Mc</td>
        <td class="halogen">Lv</td>
        <td class="noble">Og</td>
    </tr>
</table>
</div>
</body>
</html>
